name: Термоточки FIRMS

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: fires

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить обработку региональных данных
        run: python -B -m unittest discover -s tests -v
      - run: python tools/update_fires.py
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      - name: Сохранить, если есть новые точки
        run: |
          if [ -n "$(git status --porcelain data/fires.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/fires.json
            git commit -m "Термоточки FIRMS: обновление"
            git push
          fi
