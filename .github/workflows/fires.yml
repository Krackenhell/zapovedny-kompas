name: Download regional boundaries
on: workflow_dispatch
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python tools/download_regions.py
      - uses: actions/upload-artifact@v4
        with:
          name: regional-osm
          path: region-downloads/
